<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bittu's Family</title>
<meta name="description" content="Follow Bittu, Tina, Mama and Simmi across Instagram, YouTube and Facebook." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF6E9;
    --peach: #FFE7D0;
    --ink: #3D2C22;
    --sub-ink: #78624F;
    --teal: #42B3A8;
    --pink: #FF8582;
    --yellow: #FFBD59;
    --card: #FFFFFF;
    --ig-1: #405DE6;
    --ig-2: #833AB4;
    --ig-3: #E1306C;
    --ig-4: #F77737;
    --ig-5: #FCAF45;
    --yt-red: #FF0000;
    --fb-blue: #1877F2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--cream) 0%, var(--peach) 100%);
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  .paw {
    position: absolute;
    opacity: 0.35;
    pointer-events: none;
  }
  .paw svg { width: 100%; height: 100%; }
  .paw-1 { top: 30px; left: 20px; width: 60px; }
  .paw-2 { top: 60px; right: 15px; width: 46px; }
  .paw-3 { bottom: 120px; left: 10px; width: 54px; }
  .paw-4 { bottom: 40px; right: 25px; width: 64px; }

  .wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 44px;
    margin: 0 0 8px;
    line-height: 1;
  }

  .subtitle {
    font-weight: 500;
    color: var(--sub-ink);
    font-size: 16px;
    margin: 0 0 10px;
  }

  .names {
    font-size: 15px;
    color: var(--teal);
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .avatars {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }

  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 10px rgba(61,44,34,0.12);
    border: 3px solid #fff;
  }
  .avatar.bittu { background: #F3D9B1; }
  .avatar.tina { background: #E9C6A6; }
  .avatar.mama { background: #F5F0E6; }
  .avatar.simmi { background: #F0B57B; }

  .card {
    background: var(--card);
    border-radius: 32px;
    padding: 28px 20px 24px;
    box-shadow: 0 12px 30px rgba(61,44,34,0.10);
  }

  .eyebrow {
    text-align: center;
    font-size: 13px;
    letter-spacing: 1.5px;
    font-weight: 600;
    color: #A9917A;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .channel {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--ink);
    padding: 16px 18px;
    border-radius: 22px;
    margin-bottom: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid transparent;
  }
  .channel:last-child { margin-bottom: 0; }
  .channel:active { transform: scale(0.98); }

  .channel.instagram {
    background: linear-gradient(135deg, #FFF0F6 0%, #FFF4EC 100%);
    border-color: #FBD9E6;
  }
  .channel.youtube {
    background: #FFEFEF;
    border-color: #FBD6D6;
  }
  .channel.facebook {
    background: #E9F1FE;
    border-color: #CFE0FB;
  }

  .icon {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon.instagram {
    background: conic-gradient(from 200deg, var(--ig-1), var(--ig-2), var(--ig-3), var(--ig-4), var(--ig-5), var(--ig-1));
  }
  .icon.instagram svg { fill: #fff; }

  .icon.youtube { background: var(--yt-red); }
  .icon.facebook { background: var(--fb-blue); }

  .icon svg { width: 26px; height: 26px; }

  .channel-text { flex: 1; min-width: 0; }
  .channel-name {
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 2px;
  }
  .channel-handle {
    font-size: 13px;
    color: var(--sub-ink);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .follow-pill {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    color: #fff;
  }
  .follow-pill.instagram { background: linear-gradient(135deg, var(--ig-3), var(--ig-4)); }
  .follow-pill.youtube { background: var(--yt-red); }
  .follow-pill.facebook { background: var(--fb-blue); }

  footer {
    text-align: center;
    margin-top: 26px;
    color: var(--sub-ink);
    font-size: 14px;
  }

  footer .brand {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: #B79E85;
    letter-spacing: 0.4px;
  }

  @media (max-width: 360px) {
    .title { font-size: 36px; }
    .channel-name { font-size: 15px; }
    .follow-pill { display: none; }
  }
</style>
</head>
